name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  typecheck:
    name: Typecheck (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - markitdown
          - markitdown-ocr
          - markitdown-mcp
          - markitdown-sample-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hatch
        run: pipx install hatch
      # Report-only: surfaces mypy annotations without blocking while
      # pre-existing type debt is cleared. Remove continue-on-error to gate.
      - name: Type check
        continue-on-error: true
        run: cd packages/${{ matrix.package }} && hatch run types:check

  test:
    name: Test (${{ matrix.package }} / py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # markitdown-ocr has a pre-existing failing test (test_pdf_multipage);
    # its leg is non-blocking until triaged. Flip optional to false to gate.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: markitdown, python-version: "3.10", optional: false }
          - { package: markitdown, python-version: "3.11", optional: false }
          - { package: markitdown, python-version: "3.12", optional: false }
          - { package: markitdown-ocr, python-version: "3.12", optional: true }
          - { package: markitdown-sample-plugin, python-version: "3.12", optional: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Hatch
        run: pipx install hatch
      - name: Run tests
        run: cd packages/${{ matrix.package }} && hatch test

  gitleaks:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, go]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  dockerfile-lint:
    name: Dockerfile lint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, frontend/Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error

  iac-checkov:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          file: compose.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif

  image-scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t markitdown:ci .
      - name: Trivy report (all HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: markitdown:ci
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
      - name: Trivy gate (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: markitdown:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (matches the shipped Docker image)
        run: pip install ./packages/markitdown[all]
      - name: Audit installed dependencies (report-only)
        run: pipx run pip-audit --strict || true

  security-summary:
    name: Security summary
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: [gitleaks, codeql, sast-semgrep, dockerfile-lint, iac-checkov, image-scan, dependency-review, pip-audit]
    permissions:
      pull-requests: write
    steps:
      - name: Find existing summary comment
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- security-summary -->"
      - name: Create or update summary comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- security-summary -->
            ## Security scan results

            | Check | Result |
            |---|---|
            | Gitleaks (secrets) | `${{ needs.gitleaks.result }}` |
            | CodeQL (Python + Go) | `${{ needs.codeql.result }}` |
            | Semgrep SAST | `${{ needs.sast-semgrep.result }}` |
            | Dockerfile lint | `${{ needs.dockerfile-lint.result }}` |
            | Checkov IaC | `${{ needs.iac-checkov.result }}` |
            | Trivy image scan | `${{ needs.image-scan.result }}` |
            | Dependency review | `${{ needs.dependency-review.result }}` |
            | pip-audit (Python SCA) | `${{ needs.pip-audit.result }}` |
