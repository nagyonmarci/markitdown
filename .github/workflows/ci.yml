name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  typecheck:
    name: Typecheck (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - markitdown
          - markitdown-ocr
          - markitdown-mcp
          - markitdown-sample-plugin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Hatch
        run: pipx install hatch==1.16.5
      # Report-only: surfaces mypy annotations without blocking while
      # pre-existing type debt is cleared. Remove continue-on-error to gate.
      - name: Type check
        continue-on-error: true
        run: cd packages/${{ matrix.package }} && hatch run types:check

  test:
    name: Test (${{ matrix.package }} / py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: markitdown, python-version: "3.10", optional: false }
          - { package: markitdown, python-version: "3.11", optional: false }
          - { package: markitdown, python-version: "3.12", optional: false }
          - { package: markitdown, python-version: "3.13", optional: false }
          - { package: markitdown-ocr, python-version: "3.12", optional: true }
          - { package: markitdown-sample-plugin, python-version: "3.12", optional: false }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Hatch
        run: pipx install hatch==1.16.5
      # markitdown-ocr has a pre-existing failing test (test_pdf_multipage);
      # its leg is non-blocking until triaged. Flip optional to false to gate.
      - name: Run tests
        continue-on-error: ${{ matrix.optional }}
        run: cd packages/${{ matrix.package }} && hatch test

  frontend-go-test:
    name: Frontend Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: frontend/go.mod
          cache-dependency-path: frontend/go.mod
      - name: Run Go tests
        run: cd frontend && go test ./...

  python-fuzz:
    name: Python fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package and atheris
        run: pip install ./packages/markitdown atheris>=2.3.0
      - name: Run fuzz target (bounded smoke run)
        run: >-
          python packages/markitdown/fuzz/fuzz_markitdown.py
          -atheris_runs=20000

  gitleaks:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, go]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: github/codeql-action/init@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
      - uses: github/codeql-action/analyze@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/python
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  dockerfile-lint:
    name: Dockerfile lint (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, frontend/Dockerfile]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error

  iac-checkov:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: bridgecrewio/checkov-action@4048c972aae68d0b983a48bb3479aab2d877b898 # v12
        with:
          file: compose.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false
      - uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif

  image-scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build Docker image
        run: docker build -t markitdown-frontend:ci .
      - name: Trivy report (all HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: markitdown-frontend:ci
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@03e4368ac7daa2bd82b3e85262f3bf87ee112f57 # v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy.sarif
      - name: Trivy gate (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: markitdown-frontend:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Non-blocking: surfaces newly introduced vulnerable/incompatibly-licensed
      # dependencies, but the repo's Dependency Graph may not be enabled.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        continue-on-error: true

  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package (matches the shipped Docker image)
        run: pip install ./packages/markitdown[all]
      - name: Audit installed dependencies (report-only)
        run: pipx run --spec pip-audit==2.10.0 pip-audit --strict || true

  security-summary:
    name: Security summary
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    needs: [gitleaks, codeql, sast-semgrep, dockerfile-lint, iac-checkov, image-scan, dependency-review, pip-audit, python-fuzz]
    permissions:
      pull-requests: write
    steps:
      - name: Find existing summary comment
        id: find-comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- security-summary -->"
      - name: Create or update summary comment
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- security-summary -->
            ## Security scan results

            | Check | Result |
            |---|---|
            | Gitleaks (secrets) | `${{ needs.gitleaks.result }}` |
            | CodeQL (Python + Go) | `${{ needs.codeql.result }}` |
            | Semgrep SAST | `${{ needs.sast-semgrep.result }}` |
            | Dockerfile lint | `${{ needs.dockerfile-lint.result }}` |
            | Checkov IaC | `${{ needs.iac-checkov.result }}` |
            | Trivy image scan | `${{ needs.image-scan.result }}` |
            | Dependency review | `${{ needs.dependency-review.result }}` |
            | pip-audit (Python SCA) | `${{ needs.pip-audit.result }}` |
            | Python fuzz (atheris) | `${{ needs.python-fuzz.result }}` |
